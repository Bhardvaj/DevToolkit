name: Post-Merge CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test & Package Main Branch
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyinstaller

      - name: Stamp Application Version
        shell: python
        run: |
          import subprocess
          import re

          tag = ""
          try:
              res = subprocess.run(["git", "describe", "--tags", "--abbrev=0"], capture_output=True, text=True)
              if res.returncode == 0 and res.stdout.strip():
                  tag = res.stdout.strip()
          except Exception:
              pass

          clean_ver = tag.lstrip("v") if tag else "0.5.1"
          print(f"Stamping post-merge build version: {clean_ver}")
          with open("devtoolkit/_version.py", "w", encoding="utf-8") as f:
              f.write(f'# Generated by Post-Merge CI\n__version__ = "{clean_ver}"\n')

          try:
              idx_path = "devtoolkit/server/static/index.html"
              with open(idx_path, "r", encoding="utf-8") as f:
                  html = f.read()
              html = re.sub(r'id="side-app-version">v[^<]+<', f'id="side-app-version">v{clean_ver}<', html)
              with open(idx_path, "w", encoding="utf-8") as f:
                  f.write(html)
          except Exception:
              pass

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Build Standalone DevToolkit.exe
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_standalone.ps1

      - name: Verify Standalone Binary (Smoke Test)
        run: |
          ./dist/DevToolkit.exe --help
          ./dist/DevToolkit.exe --version
          ./dist/DevToolkit.exe daemon status
          ./dist/DevToolkit.exe native --help
          ./dist/DevToolkit.exe inspect


      - name: Upload Standalone Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevToolkit-Main-Windows-x64
          path: |
            dist/DevToolkit.exe
            dist/devtoolkit.config.yaml
          if-no-files-found: error
