name: Build & Release DevToolkit

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  test-and-package:
    name: Test & Package Windows Standalone
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyinstaller

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Build Standalone DevToolkit.exe
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_standalone.ps1

      - name: Verify Standalone Binary (Smoke Test)
        run: |
          ./dist/DevToolkit.exe --help
          ./dist/DevToolkit.exe inspect

      - name: Upload Standalone Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevToolkit-Windows-x64
          path: dist/DevToolkit.exe
          if-no-files-found: error

      - name: Attach Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DevToolkit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
