name: Build & Release DevToolkit

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish an official GitHub Release"
        required: false
        type: boolean
        default: false
      tag_name:
        description: "Release tag (e.g. v0.2.0, only used if publishing release)"
        required: false
        type: string
        default: ""
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  test-and-package:
    name: Test & Package Windows Standalone
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyinstaller

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Build Standalone DevToolkit.exe
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_standalone.ps1

      - name: Verify Standalone Binary (Smoke Test)
        run: |
          ./dist/DevToolkit.exe --help
          ./dist/DevToolkit.exe inspect

      - name: Upload Standalone Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevToolkit-Windows-x64
          path: dist/DevToolkit.exe
          if-no-files-found: error

      - name: Attach Binary to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/DevToolkit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
