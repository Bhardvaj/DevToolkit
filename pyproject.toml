[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devtoolkit"
version = "0.5.1"
description = "Extensible developer environment auditor and workstation utility"
readme = "README.md"
authors = [{ name = "Bhardvaj" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pywebview>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
devtoolkit = "devtoolkit.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["devtoolkit*"]
