<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevToolkit Spotlight</title>
  <link rel="icon" type="image/x-icon" href="../../assets/devspotlight.ico">
  <style>
    :root {
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.30);
      --bg-opacity: 0.92;
      --bg-base: rgba(10, 14, 23, var(--bg-opacity));
      --bg-card: rgba(15, 23, 42, 0.85);
      --bg-hover: rgba(30, 41, 59, 0.7);
      --bg-active: rgba(56, 189, 248, 0.12);
      --border: rgba(56, 189, 248, 0.38);
      --border-active: rgba(56, 189, 248, 0.75);
      --divider: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-sans: 'Segoe UI Variable', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
      --blur-val: 20px;
      --corner-radius: 8px;
      --anim-duration: 160ms;
      --anim-fast: 110ms;
      --anim-stagger: 14ms;
      --anim-curve: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    input, textarea, select, [contenteditable="true"] {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    html, body {
      background: transparent;
      font-family: var(--font-sans);
      color: var(--text-main);
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
    }

    /* Floating Window Card */
    .spotlight-shell {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--corner-radius, 8px);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.85), 0 0 30px var(--accent-glow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(var(--blur-val, 28px)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur-val, 28px)) saturate(180%);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .spotlight-shell:focus-within {
      border-color: var(--border-active) !important;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.85), 0 0 36px var(--accent-glow) !important;
    }

    /* Search Bar */
    .search-bar {
      display: flex;
      align-items: center;
      padding: 0 18px;
      height: 58px;
      min-height: 58px;
      gap: 14px;
    }

    .search-bar.has-results {
      border-bottom: 1px solid var(--divider);
    }

    .search-icon {
      color: var(--accent);
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      transition: transform var(--anim-fast) var(--anim-curve), color var(--anim-fast) ease;
    }

    .search-bar:focus-within .search-icon {
      transform: scale(1.06);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 19px;
      color: var(--text-main);
      font-family: var(--font-sans);
      caret-color: var(--accent);
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .prefix-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: none;
      flex-shrink: 0;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      animation: badgePop var(--anim-fast) var(--anim-curve) both;
    }

    @keyframes badgePop {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Main Content Area */
    .content-area {
      display: none;
      flex: 1;
      overflow: hidden;
    }

    .content-area.visible {
      display: flex;
      animation: contentFadeIn var(--anim-duration) var(--anim-curve) both;
    }

    @keyframes contentFadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Results List */
    .results-list {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      list-style: none;
      padding: 4px 0;
      transition: width var(--anim-fast) var(--anim-curve), flex var(--anim-fast) var(--anim-curve);
    }

    .content-area.details-open .results-list {
      flex: 0 0 52%;
      max-width: 52%;
      width: 52%;
      border-right: 1px solid var(--divider);
    }

    .results-list::-webkit-scrollbar {
      width: 6px;
    }
    .results-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .result-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 7px 18px;
      cursor: pointer;
      gap: 13px;
      min-height: 50px;
      box-sizing: border-box;
      transition: background var(--anim-fast) ease;
      animation: itemSlideIn var(--anim-duration) var(--anim-curve) both;
      animation-delay: calc(var(--item-idx, 0) * var(--anim-stagger));
    }

    @keyframes itemSlideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-item:hover {
      background: var(--bg-hover);
    }

    .result-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      opacity: 0;
      transform: scaleY(0.3);
      transition: opacity var(--anim-fast) ease, transform var(--anim-fast) var(--anim-curve);
    }

    .result-item.active::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .result-item.active {
      background: var(--bg-active);
    }

    .item-icon-box {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform var(--anim-fast) var(--anim-curve);
    }

    .item-icon-box svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    .item-icon-img {
      width: 32px;
      height: 32px;
      max-width: 32px;
      max-height: 32px;
      object-fit: contain;
      border-radius: 6px;
      image-rendering: -webkit-optimize-contrast;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.28));
      display: block;
    }

    /* Clean borderless presentation for real application icons */
    .item-icon-box.is-app-icon,
    .item-icon-box:has(.item-icon-img) {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .item-icon-box.icon-app { color: #38bdf8; background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.22); }
    .item-icon-box.icon-port { color: #34d399; background: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.22); }
    .item-icon-box.icon-tool { color: #a78bfa; background: rgba(167, 139, 250, 0.1); border-color: rgba(167, 139, 250, 0.22); }
    .item-icon-box.icon-calc { color: #f59e0b; background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.22); }
    .item-icon-box.icon-dir { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.22); }
    .item-icon-box.icon-proj { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.22); }
    .item-icon-box.icon-win { color: #38bdf8; background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.22); }
    .item-icon-box.icon-help { color: #a78bfa; background: rgba(167, 139, 250, 0.1); border-color: rgba(167, 139, 250, 0.22); }
    .item-icon-box.icon-config { color: #38bdf8; background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.22); }
    .item-icon-box.icon-offline { color: #fbbf24; background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.3); }
    .item-icon-box.icon-ready { color: #34d399; background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.3); }
    .item-icon-box.icon-code { color: #38bdf8; background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.22); }
    .item-icon-box.icon-file { color: #94a3b8; background: rgba(148, 163, 184, 0.08); border-color: rgba(148, 163, 184, 0.15); }
    .item-icon-box.icon-kill { color: #f87171; background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.25); }

    .result-item:hover .item-icon-box,
    .result-item.active .item-icon-box {
      transform: scale(1.06);
    }

    .result-info {
      flex: 1;
      overflow: hidden;
    }

    .result-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.25;
    }

    .result-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      font-family: var(--font-sans);
      line-height: 1.2;
    }

    .item-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .badge-APP { color: #38bdf8; background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.3); }
    .badge-PORT { color: #34d399; background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.3); }
    .badge-TOOL { color: #a78bfa; background: rgba(167, 139, 250, 0.12); border-color: rgba(167, 139, 250, 0.3); }
    .badge-CALC { color: #f59e0b; background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.3); }
    .badge-ONLINE { color: var(--text-dim); background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.12); font-weight: 500; }
    .badge-OFFLINE { color: var(--text-dim); background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.08); font-weight: 500; }
    .badge-DAEMON { color: var(--accent); background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.22); font-weight: 500; }
    .badge-READY { color: #34d399; background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.3); }
    .badge-CMD { color: #38bdf8; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); }
    .badge-HELP { color: #a78bfa; background: rgba(167, 139, 250, 0.15); border-color: rgba(167, 139, 250, 0.3); }
    .badge-WIN { color: #38bdf8; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); }
    .badge-PROJ { color: #fbbf24; background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.3); }
    .badge-CONFIG { color: #38bdf8; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); }
    .badge-SETTINGS { color: #38bdf8; background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); }
    .badge-DEV { color: #34d399; background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.35); font-weight: 700; }
    .badge-DATABASE { color: #818cf8; background: rgba(129, 140, 248, 0.15); border-color: rgba(129, 140, 248, 0.35); }
    .badge-DEBUG { color: #f472b6; background: rgba(244, 114, 182, 0.15); border-color: rgba(244, 114, 182, 0.35); }
    .badge-SERVICE { color: #94a3b8; background: rgba(148, 163, 184, 0.12); border-color: rgba(148, 163, 184, 0.25); }
    .badge-PORTS { color: #34d399; background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.3); }
    .badge-HEALTHY { color: #10b981; background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.35); font-weight: 600; }
    .badge-ACTION_NEEDED { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.35); font-weight: 600; }
    .badge-WARNING { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.35); font-weight: 600; }
    .badge-ERROR { color: #ef4444; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.35); font-weight: 600; }
    .badge-NOT_DETECTED { color: #94a3b8; background: rgba(148, 163, 184, 0.12); border-color: rgba(148, 163, 184, 0.25); }
    .badge-NOT_FOUND { color: #94a3b8; background: rgba(148, 163, 184, 0.12); border-color: rgba(148, 163, 184, 0.25); }
    .badge-TOOLS { color: #a78bfa; background: rgba(167, 139, 250, 0.12); border-color: rgba(167, 139, 250, 0.3); }

    /* Details Panel (No scrollbar shown) */
    .details-panel {
      flex: 0 0 48%;
      max-width: 48%;
      width: 48%;
      background: rgba(10, 14, 23, 0.35);
      padding: 14px 18px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      display: none;
      flex-direction: column;
      animation: drawerSlideIn var(--anim-duration) var(--anim-curve) both;
      box-sizing: border-box;
    }

    .details-panel::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .content-area.details-open .details-panel {
      display: flex;
    }

    @keyframes drawerSlideIn {
      from {
        opacity: 0;
        transform: translateX(10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Details Hero */
    .detail-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 6px 0 10px 0;
      width: 100%;
      flex-shrink: 0;
    }

    .detail-hero-icon-box {
      width: 64px;
      height: 64px;
      min-width: 64px;
      min-height: 64px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
      transition: transform var(--anim-fast) var(--anim-curve);
    }

    /* Unboxed, borderless hero icon with realistic depth shadow */
    .detail-hero-icon-box.is-app-icon,
    .detail-hero-icon-box:has(.detail-hero-img) {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }

    .detail-hero-icon-box svg {
      width: 32px;
      height: 32px;
      stroke-width: 1.8;
    }

    .detail-hero-img {
      width: 64px;
      height: 64px;
      max-width: 64px;
      max-height: 64px;
      object-fit: contain;
      border-radius: 10px;
      image-rendering: -webkit-optimize-contrast;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.42));
      display: block;
    }

    .detail-hero-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .detail-hero-badge {
      font-size: 9.5px;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 2.5px 8px;
      border-radius: 5px;
      letter-spacing: 0.02em;
    }

    /* Divider */
    .detail-divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 8px 0;
      flex-shrink: 0;
    }

    /* Full Path Box */
    .detail-path-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 8px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
      transition: background var(--anim-fast) ease, border-color var(--anim-fast) ease;
    }

    .detail-path-container:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .detail-path-text {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .detail-copy-btn {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
      flex-shrink: 0;
    }

    .detail-copy-btn:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    /* Key-Value Table */
    .detail-meta-table {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .detail-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
    }

    .detail-meta-key {
      color: var(--text-dim);
      font-weight: 500;
    }

    .detail-meta-val {
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11.5px;
      text-align: right;
      max-width: 65%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Actions Section */
    .detail-actions-section {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
    }

    .detail-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 11px;
      cursor: pointer;
      outline: none;
      transition: all 0.12s ease;
    }

    .detail-action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .detail-action-btn.action-danger:hover {
      border-color: #f87171;
      color: #f87171;
      background: rgba(248, 113, 113, 0.12);
    }

    .detail-action-btn .action-kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 9px;
      font-family: var(--font-mono);
      color: var(--text-dim);
    }

    /* Tool Deep Diagnostics in Details Panel */
    .detail-deep-telemetry {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
      width: 100%;
    }

    .detail-deep-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Footer / Keyboard hints */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      height: 34px;
      min-height: 34px;
      background: rgba(8, 9, 12, 0.60);
      border-top: 1px solid var(--divider);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .status-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      user-select: none;
    }

    .hotkey-hints {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Settings Row Styles (Rendered same as search results) */
    .setting-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 18px;
      min-height: 52px;
      box-sizing: border-box;
      gap: 16px;
      cursor: default;
      transition: background var(--anim-fast) ease;
      animation: itemSlideIn var(--anim-duration) var(--anim-curve) both;
      animation-delay: calc(var(--item-idx, 0) * var(--anim-stagger));
    }

    .setting-item:hover {
      background: var(--bg-hover);
    }

    .setting-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      opacity: 0;
      transform: scaleY(0.3);
      transition: opacity var(--anim-fast) ease, transform var(--anim-fast) var(--anim-curve);
    }

    .setting-item.active::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .setting-item.active {
      background: var(--bg-active);
    }

    .setting-control {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .slider-control {
      width: 190px;
    }

    .setting-range {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
    }

    .setting-val-label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      min-width: 44px;
      text-align: right;
    }

    .setting-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--font-sans);
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .setting-select:focus {
      border-color: var(--accent);
    }

    .setting-select option {
      background: #0f172a;
      color: #f1f5f9;
    }

    .toggle-btn {
      padding: 4px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
      outline: none;
    }

    .toggle-btn.active {
      background: rgba(52, 211, 153, 0.18);
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.4);
    }

    .toggle-btn:not(.active) {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .setting-hotkey-badge {
      font-size: 11px;
      padding: 3px 9px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .color-presets {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s ease, border-color 0.12s ease;
      box-sizing: border-box;
    }

    .color-dot:hover {
      transform: scale(1.2);
    }

    .color-dot.active {
      border-color: #ffffff;
      box-shadow: 0 0 6px var(--accent);
    }
  </style>
</head>
<body>

<div class="spotlight-shell">
  <!-- Search Bar -->
  <div class="search-bar">
    <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Search files, apps (vsc), ports (port:), tools (tool:), actions (>)..." autofocus spellcheck="false" autocomplete="off" />
    <span class="prefix-badge" id="prefixBadge">ALL</span>
  </div>

  <!-- Content -->
  <div class="content-area" id="contentArea">
    <ul class="results-list" id="resultsList"></ul>
    <div class="details-panel" id="detailsPanel">
      <!-- Details dynamically rendered -->
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-bar">
    <div class="hotkey-hints" id="hotkeyHints">
      <span><span class="key-badge">↑↓</span> Navigate</span>
      <span><span class="key-badge">↵</span> Open</span>
      <span><span class="key-badge">Shift+↵</span> Explorer</span>
      <span id="footerDetailsToggle" style="cursor: pointer;" title="Toggle Details Panel (F1)"><span class="key-badge">F1</span> <span id="footerDetailsLabel">Details</span></span>
      <span><span class="key-badge">Esc</span> Dismiss</span>
    </div>
    <div id="statusIndicator" class="status-indicator" style="display: none;"></div>
  </div>
</div>

  };

  function getItemIconClass(item) {
    if (!item) return 'icon-file';
    const badge = (item.badge || '').toUpperCase();
    const type = (item.type || item.entry_type || '').toLowerCase();
    const act = (item.action || '').toLowerCase();

    if (item.id === 'act_daemon_status' || badge === 'ONLINE' || badge === 'OFFLINE' || badge === 'DAEMON' || act === 'start_daemon') return 'icon-config';
    if (badge === 'OFFLINE' || item.id === 'daemon_offline_banner') return 'icon-offline';
    if (badge === 'READY') return 'icon-ready';
    if (badge === 'KILL') return 'icon-kill';
    if (badge === 'APP' || type === 'app' || act === 'launch_app') return 'icon-app';
    if (badge === 'PORT' || type.startsWith('port')) return 'icon-port';
    if (badge === 'TOOL' || type === 'tool') return 'icon-tool';
    if (badge === 'CALC' || type === 'calc') return 'icon-calc';
    if (badge === 'DIR' || item.is_dir || type === 'dir' || type === 'folder') return 'icon-dir';
    if (badge === 'PROJ' || type === 'project') return 'icon-proj';
    if (badge === 'WIN' || type === 'window') return 'icon-win';
    if (badge === 'HELP' || type === 'help') return 'icon-help';
    if (badge === 'SETTINGS' || badge === 'CONFIG' || act === 'open_settings') return 'icon-config';
    if (badge === 'CMD' || act === 'command') return 'icon-app';
    if (CODE_EXTS.has(badge)) return 'icon-code';
    return 'icon-file';
  }

  function getItemIconHtml(item) {
    if (item && item.icon) {
      return `<img class="item-icon-img" src="${item.icon}" alt="" />`;
    }
    const cls = getItemIconClass(item);
    if (cls === 'icon-offline') return SVG_ICONS.offline;
    if (cls === 'icon-ready') return SVG_ICONS.ready;
    if (cls === 'icon-kill') return SVG_ICONS.kill;
    if (cls === 'icon-app') return SVG_ICONS.app;
    if (cls === 'icon-port') return SVG_ICONS.port;
    if (cls === 'icon-tool') return SVG_ICONS.tool;
    if (cls === 'icon-calc') return SVG_ICONS.calc;
    if (cls === 'icon-dir') return SVG_ICONS.dir;
    if (cls === 'icon-proj') return SVG_ICONS.proj;
    if (cls === 'icon-win') return SVG_ICONS.win;
    if (cls === 'icon-help') return SVG_ICONS.help;
    if (cls === 'icon-config') return SVG_ICONS.config;
    if (cls === 'icon-code') return SVG_ICONS.code;
    return SVG_ICONS.file;
  }

  function getSettingIconClass(key) {
    if (key === 'show_details_panel') return 'icon-app';
    if (key === 'accent_color') return 'icon-config';
    if (key === 'opacity') return 'icon-app';
    if (key === 'blur_radius') return 'icon-tool';
    if (key === 'animation_speed') return 'icon-calc';
    if (key === 'monitor_mode') return 'icon-win';
    if (key === 'dismiss_on_blur') return 'icon-calc';
    if (key === 'theme_preset') return 'icon-proj';
    if (key === 'hotkey') return 'icon-help';
    return 'icon-config';
  }

  function getSettingIconHtml(key) {
    if (key === 'show_details_panel') return SVG_ICONS.details;
    if (key === 'accent_color') return SVG_ICONS.color;
    if (key === 'opacity') return SVG_ICONS.opacity;
    if (key === 'blur_radius') return SVG_ICONS.blur;
    if (key === 'animation_speed') return SVG_ICONS.speed;
    if (key === 'monitor_mode') return SVG_ICONS.monitor;
    if (key === 'dismiss_on_blur') return SVG_ICONS.dismiss;
    if (key === 'theme_preset') return SVG_ICONS.theme;
    if (key === 'hotkey') return SVG_ICONS.keyboard;
    return SVG_ICONS.config;
  }

  const searchInput = document.getElementById('searchInput');
  const resultsList = document.getElementById('resultsList');
  const prefixBadge = document.getElementById('prefixBadge');
  const contentArea = document.getElementById('contentArea');
  const detailsPanel = document.getElementById('detailsPanel');
  const metadataCache = new Map();

  // Input listener with debounce
  searchInput.addEventListener('input', (e) => {
    const val = e.target.value;
    if (isSettingsMode) {
      const v = val.trim();
      if (!v) {
        closeSettings();
        return;
      }
      if (v.startsWith('> settings') || v.startsWith('>settings') || v.startsWith('settings')) {
        let filter = v.replace(/^>*\s*settings\s*/i, '');
        renderSettings(filter);
        return;
      } else {
        isSettingsMode = false;
        callBackend('set_settings_open', { open: false });
      }
    }
    updatePrefixBadge(val);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      performSearch(val);
    }, 40);
  });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    // F1 to toggle Details Panel
    if (e.key === 'F1') {
      e.preventDefault();
      toggleDetailsPanel();
      return;
    }

    if (e.key === 'Escape') {
      if (isSettingsMode) {
        closeSettings();
        return;
      }
      if (searchInput.value.length > 0) {
        searchInput.value = '';
        updatePrefixBadge('');
        performSearch('');
      } else {
        callBackend('hide_window');
      }
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const count = isSettingsMode ? resultsList.children.length : items.length;
      if (count > 0) {
        activeIndex = (activeIndex + 1) % count;
        renderSelection();
      }
      return;
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      const count = isSettingsMode ? resultsList.children.length : items.length;
      if (count > 0) {
        activeIndex = (activeIndex - 1 + count) % count;
        renderSelection();
      }
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      const current = items[activeIndex];
      if (!current) return;

      if (e.ctrlKey && e.shiftKey) {
        // Run as Administrator
        callBackend('execute_item', { item: current, verb: 'runas' });
      } else if (e.shiftKey) {
        // Reveal in Explorer / Process details
        callBackend('execute_item', { item: current, verb: 'reveal' });
      } else {
        // Standard action
        handlePrimaryAction(current);
      }
      return;
    }

    // Ctrl+C to copy path or value when no text selection is active
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
      const activeEl = document.activeElement;
      const isInputTextSelected = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') && activeEl.selectionStart !== activeEl.selectionEnd;
      if (!isInputTextSelected && !window.getSelection().toString()) {
        const current = items[activeIndex];
        if (current) {
          e.preventDefault();
          const targetVal = current.path || current.value || current.title;
          copyItemText(targetVal);
          return;
        }
      }
    }

    // Ctrl+K to kill port or close window
    if (e.ctrlKey && (e.key === 'k' || e.key === 'K') || e.key === 'Delete') {
      e.preventDefault();
      const current = items[activeIndex];
      if (current && (current.type.startsWith('port') || current.badge === 'KILL' || current.badge === 'WINDOW')) {
        callBackend('execute_item', { item: current, verb: 'kill' });
      }
      return;
    }
  });

  function updatePrefixBadge(q) {
    const s = q.trim();
    let badge = '';
    if (isSettingsMode || s.startsWith('> settings') || s.startsWith('>settings') || s === 'settings') {
      badge = 'SETTINGS';
    } else if (s.startsWith('port:') || s.startsWith('ports:')) {
      badge = 'PORT';
    } else if (s.startsWith('tool:') || s.startsWith('tools:')) {
      badge = 'TOOL';
    } else if (s.startsWith('proj:') || s.startsWith('project:')) {
      badge = 'PROJ';
    } else if (s.startsWith('w:') || s.startsWith('window:')) {
      badge = 'WIN';
    } else if (s.startsWith('>') || s.startsWith('/')) {
      badge = 'CMD';
    } else if (s.startsWith('=')) {
      badge = 'CALC';
    } else if (s.startsWith('?')) {
      badge = 'HELP';
    }

    if (badge) {
      prefixBadge.textContent = badge;
      prefixBadge.className = 'prefix-badge badge-' + badge;
      prefixBadge.style.display = 'inline-block';
    } else {
      prefixBadge.className = 'prefix-badge';
      prefixBadge.style.display = 'none';
    }
  }

  function handlePrimaryAction(item) {
    if (item.action === 'start_daemon') {
      item.title = '⏳ Starting DevToolkit Daemon...';
      item.subtitle = 'Launching external daemon process...';
      renderResults();
      callBackend('execute_item', { item: item, verb: 'open' }).then(() => {
        setTimeout(() => {
          checkDaemonStatus();
          if (searchInput.value.trim().startsWith('>')) {
            performSearch(searchInput.value);
          }
        }, 1500);
      });
      return;
    }
    if (item.action === 'none') {
      return;
    }
    if (item.action === 'drilldown_port') {
      searchInput.value = 'port:' + item.port;
      updatePrefixBadge(searchInput.value);
      performSearch(searchInput.value);
      return;
    }
    if (item.action === 'drilldown_tool') {
      searchInput.value = 'tool:' + item.tool_id;
      updatePrefixBadge(searchInput.value);
      performSearch(searchInput.value);
      return;
    }
    if (item.action === 'open_deep_drawer') {
      if (!currentSettings.show_details_panel) {
        toggleDetailsPanel();
      }
      inspectToolDeep(item.tool_id);
      return;
    }
    if (item.action === 'open_settings') {
      openSettings();
      return;
    }
    callBackend('execute_item', { item: item, verb: 'open' });
  }

  function toggleDetailsPanel() {
    currentSettings.show_details_panel = !currentSettings.show_details_panel;
    callBackend('update_settings', { show_details_panel: currentSettings.show_details_panel });
    updateDetailsPanelVisibility();
    if (currentSettings.show_details_panel && items[activeIndex]) {
      renderDetailsPanel(items[activeIndex]);
    } else {
      updateLayout();
    }
  }

  function setShowDetailsPanel(val) {
    currentSettings.show_details_panel = !!val;
    callBackend('update_settings', { show_details_panel: currentSettings.show_details_panel });
    updateDetailsPanelVisibility();
    if (currentSettings.show_details_panel && items[activeIndex]) {
      renderDetailsPanel(items[activeIndex]);
    } else {
      updateLayout();
    }
    if (isSettingsMode) renderSettings();
  }

  function updateDetailsPanelVisibility() {
    const shouldShow = currentSettings.show_details_panel && !isSettingsMode && items.length > 0;
    if (shouldShow) {
      contentArea.classList.add('details-open');
      detailsPanel.style.display = 'flex';
    } else {
      contentArea.classList.remove('details-open');
      detailsPanel.style.display = 'none';
    }
    const footerDetailsLabel = document.getElementById('footerDetailsLabel');
    if (footerDetailsLabel) {
      footerDetailsLabel.textContent = currentSettings.show_details_panel ? 'Hide Details' : 'Details';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeForAttr(str) {
    if (!str) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;');
  }

  function copyItemText(text) {
    if (!text) return;
    callBackend('execute_item', { item: { path: text, value: text }, verb: 'copy' });
    const copyBtns = document.querySelectorAll('.detail-copy-btn');
    copyBtns.forEach(btn => {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      btn.style.color = '#34d399';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.color = '';
      }, 1400);
    });
  }

  function executeCurrentItem(verb) {
    const current = items[activeIndex];
    if (!current) return;
    if (verb === 'open') {
      handlePrimaryAction(current);
    } else {
      callBackend('execute_item', { item: current, verb: verb });
    }
  }

  function renderDetailsPanel(item) {
    if (!detailsPanel || !item) return;

    const badgeStr = (item.badge || item.category || (item.entry_type || '').toUpperCase() || 'ITEM');
    const badgeClass = 'badge-' + String(badgeStr).replace(/\s+/g, '_');
    const iconCls = getItemIconClass(item);
    const iconHtml = getItemIconHtml(item);

    // Hero icon
    let heroIconInner = iconHtml;
    let heroBoxCls = `detail-hero-icon-box ${iconCls}`;
    if (item.icon) {
      heroIconInner = `<img class="detail-hero-img" src="${item.icon}" alt="" />`;
      heroBoxCls += ' is-app-icon';
    }

    const titleText = escapeHtml(item.title || item.name || '');
    const pathText = item.path || '';
    const safePath = escapeForAttr(pathText);

    let html = `
      <div class="detail-hero">
        <div class="${heroBoxCls}">
          ${heroIconInner}
        </div>
        <div class="detail-hero-title" title="${titleText}">${titleText}</div>
        <div>
          <span class="detail-hero-badge item-badge ${badgeClass}">${escapeHtml(badgeStr)}</span>
        </div>
      </div>
      <div class="detail-divider"></div>
    `;

    // Path Box if item has path or address
    if (pathText) {
      html += `
        <div class="detail-path-container" onclick="copyItemText('${safePath}')" title="Click to copy full path">
          <span class="detail-path-text">${escapeHtml(pathText)}</span>
          <button class="detail-copy-btn" onclick="event.stopPropagation(); copyItemText('${safePath}')">Copy</button>
        </div>
      `;
    }

    // Key-Value Metadata Table
    html += `<div class="detail-meta-table" id="detailMetaTable">`;

    const typeStr = (item.type || item.entry_type || '').toLowerCase();

    if (item.port !== undefined) {
      // Port item
      html += `
        <div class="detail-meta-row"><span class="detail-meta-key">Port</span><span class="detail-meta-val">:${item.port}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Process</span><span class="detail-meta-val">${escapeHtml(item.process_name || 'Unknown')}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">PID</span><span class="detail-meta-val">${item.pid || '—'}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Category</span><span class="detail-meta-val">${escapeHtml(item.category || (item.is_dev ? 'Dev' : 'Service'))}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Role</span><span class="detail-meta-val">${item.is_dev ? 'Developer Server' : 'Service Socket'}</span></div>
      `;
    } else if (item.tool_id !== undefined) {
      // Tool item
      html += `
        <div class="detail-meta-row"><span class="detail-meta-key">Status</span><span class="detail-meta-val">${escapeHtml(item.status || 'Unknown')}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Version</span><span class="detail-meta-val">${escapeHtml(item.version || 'Not Detected')}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Category</span><span class="detail-meta-val">${escapeHtml(item.category || 'General')}</span></div>
      `;
      if (item.path) {
        html += `<div class="detail-meta-row"><span class="detail-meta-key">Binary</span><span class="detail-meta-val">${escapeHtml(item.path)}</span></div>`;
      }
    } else if (typeStr === 'project' || item.project_name) {
      // Project workstation audit item
      html += `
        <div class="detail-meta-row"><span class="detail-meta-key">Project</span><span class="detail-meta-val">${escapeHtml(item.project_name || item.title)}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Framework</span><span class="detail-meta-val">${escapeHtml(item.frameworks || 'Standard')}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Git Branch</span><span class="detail-meta-val">${escapeHtml(item.branch || 'None')}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Cleanable</span><span class="detail-meta-val">${item.cleanable_mb !== undefined ? item.cleanable_mb + ' MB' : '0 MB'}</span></div>
      `;
    } else if (typeStr === 'window' || item.hwnd) {
      // Running top-level desktop window item
      html += `
        <div class="detail-meta-row"><span class="detail-meta-key">Window Title</span><span class="detail-meta-val">${escapeHtml(item.title)}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">PID</span><span class="detail-meta-val">${item.pid || '—'}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">HWND</span><span class="detail-meta-val">${item.hwnd || '—'}</span></div>
      `;
    } else if (typeStr === 'calc' || item.badge === 'CALC') {
      // Math / Base / UUID calculation item
      html += `
        <div class="detail-meta-row"><span class="detail-meta-key">Expression</span><span class="detail-meta-val">${escapeHtml(searchInput.value)}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Result</span><span class="detail-meta-val">${escapeHtml(item.title)}</span></div>
      `;
    } else if (item.id === 'act_daemon_status' || item.action === 'start_daemon' || badgeStr === 'ONLINE' || badgeStr === 'OFFLINE' || badgeStr === 'DAEMON') {
      const isOnline = item.status === 'online' || isDaemonOnline;
      html += `
        <div class="detail-meta-row"><span class="detail-meta-key">Status</span><span class="detail-meta-val" style="color:var(--text-main);font-weight:600;">${isOnline ? 'Online' : 'Offline'}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Port</span><span class="detail-meta-val">${item.port || 4321}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Service</span><span class="detail-meta-val">Local Workstation API</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Address</span><span class="detail-meta-val">http://127.0.0.1:${item.port || 4321}</span></div>
      `;
    } else if (typeStr === 'guide' || item.badge === 'CMD' || item.badge === 'CONFIG') {
      // Guide or system action item
      html += `
        <div class="detail-meta-row"><span class="detail-meta-key">Action</span><span class="detail-meta-val">${escapeHtml(item.command || item.title)}</span></div>
        <div class="detail-meta-row"><span class="detail-meta-key">Mode</span><span class="detail-meta-val">${escapeHtml(item.badge || 'Command')}</span></div>
      `;
    } else {
      // General File / Directory / Desktop Shortcut Application item
      const cached = metadataCache.get(pathText);
      if (cached && cached.exists) {
        html += `
          <div class="detail-meta-row"><span class="detail-meta-key">File Size</span><span class="detail-meta-val">${cached.file_size || item.size_formatted || '—'}</span></div>
          <div class="detail-meta-row"><span class="detail-meta-key">Created</span><span class="detail-meta-val">${cached.created_time || '—'}</span></div>
          <div class="detail-meta-row"><span class="detail-meta-key">Last Modified</span><span class="detail-meta-val">${cached.modified_time || '—'}</span></div>
          <div class="detail-meta-row"><span class="detail-meta-key">Type</span><span class="detail-meta-val">${cached.file_type || badgeStr}</span></div>
        `;
      } else {
        html += `
          <div class="detail-meta-row"><span class="detail-meta-key">File Size</span><span class="detail-meta-val" id="metaFileSize">${item.size_formatted || '...'}</span></div>
          <div class="detail-meta-row"><span class="detail-meta-key">Created</span><span class="detail-meta-val" id="metaCreated">...</span></div>
          <div class="detail-meta-row"><span class="detail-meta-key">Last Modified</span><span class="detail-meta-val" id="metaModified">...</span></div>
          <div class="detail-meta-row"><span class="detail-meta-key">Type</span><span class="detail-meta-val">${badgeStr}</span></div>
        `;
        if (pathText) {
          const fetchForPath = pathText;
          callBackend('get_item_metadata', { path: fetchForPath }).then(meta => {
            if (meta) {
              metadataCache.set(fetchForPath, meta);
              if (items[activeIndex] && items[activeIndex].path === fetchForPath) {
                const fsEl = document.getElementById('metaFileSize');
                const crEl = document.getElementById('metaCreated');
                const moEl = document.getElementById('metaModified');
                if (fsEl) fsEl.textContent = meta.file_size || items[activeIndex].size_formatted || '—';
                if (crEl) crEl.textContent = meta.created_time || '—';
                if (moEl) moEl.textContent = meta.modified_time || '—';
                updateLayout();
              }
            }
          });
        }
      }
    }

    html += `</div>`; // Close detail-meta-table
    html += `<div id="detailDeepContainer"></div>`;

    // Interactive Action Buttons at bottom (NO Alt+1..9 chips)
    html += `<div class="detail-actions-section">`;
    if (item.port !== undefined) {
      if (item.is_dev) {
        html += `<button class="detail-action-btn" onclick="executeCurrentItem('open')"><span class="action-label">Open Browser</span><span class="action-kbd">↵</span></button>`;
      }
      html += `<button class="detail-action-btn action-danger" onclick="executeCurrentItem('kill')"><span class="action-label">Kill Port</span><span class="action-kbd">Ctrl+K</span></button>`;
      html += `<button class="detail-action-btn" onclick="copyItemText('${item.port}')"><span class="action-label">Copy Port</span><span class="action-kbd">Ctrl+C</span></button>`;
    } else if (item.tool_id !== undefined) {
      html += `<button class="detail-action-btn" onclick="inspectToolDeep('${item.tool_id}')"><span class="action-label">Deep Diagnostics</span><span class="action-kbd">↵</span></button>`;
      if (pathText) {
        html += `<button class="detail-action-btn" onclick="copyItemText('${safePath}')"><span class="action-label">Copy Path</span><span class="action-kbd">Ctrl+C</span></button>`;
      }
    } else if (typeStr === 'window' || item.hwnd) {
      html += `<button class="detail-action-btn" onclick="executeCurrentItem('open')"><span class="action-label">Switch Window</span><span class="action-kbd">↵</span></button>`;
      html += `<button class="detail-action-btn action-danger" onclick="executeCurrentItem('kill')"><span class="action-label">Close Window</span><span class="action-kbd">Ctrl+K</span></button>`;
    } else if (typeStr === 'project') {
      html += `<button class="detail-action-btn" onclick="executeCurrentItem('open')"><span class="action-label">Open Terminal</span><span class="action-kbd">↵</span></button>`;
      html += `<button class="detail-action-btn" onclick="executeCurrentItem('reveal')"><span class="action-label">Explorer</span><span class="action-kbd">Shift+↵</span></button>`;
      if (pathText) {
        html += `<button class="detail-action-btn" onclick="copyItemText('${safePath}')"><span class="action-label">Copy Path</span><span class="action-kbd">Ctrl+C</span></button>`;
      }
    } else if (item.id === 'act_daemon_status' || item.action === 'start_daemon' || badgeStr === 'ONLINE' || badgeStr === 'OFFLINE' || badgeStr === 'DAEMON') {
      const isOnline = item.status === 'online' || isDaemonOnline;
      if (isOnline) {
        html += `<button class="detail-action-btn" onclick="executeCurrentItem('open')"><span class="action-label">Open Web UI</span><span class="action-kbd">↵</span></button>`;
      } else {
        html += `<button class="detail-action-btn" onclick="executeCurrentItem('open')"><span class="action-label">Launch Daemon</span><span class="action-kbd">↵</span></button>`;
      }
    } else if (typeStr === 'calc' || item.badge === 'CALC') {
      html += `<button class="detail-action-btn" onclick="copyItemText('${escapeForAttr(item.title)}')"><span class="action-label">Copy Result</span><span class="action-kbd">Ctrl+C</span></button>`;
    } else {
      // General File / Desktop App / Folder
      html += `<button class="detail-action-btn" onclick="executeCurrentItem('open')"><span class="action-label">${item.is_dir ? 'Open Folder' : 'Open'}</span><span class="action-kbd">↵</span></button>`;
      if (pathText) {
        html += `<button class="detail-action-btn" onclick="executeCurrentItem('reveal')"><span class="action-label">Explorer</span><span class="action-kbd">Shift+↵</span></button>`;
        if (badgeStr === 'APP' || (pathText.toLowerCase().endsWith('.exe') || pathText.toLowerCase().endsWith('.lnk') || pathText.toLowerCase().endsWith('.bat'))) {
          html += `<button class="detail-action-btn" onclick="executeCurrentItem('runas')"><span class="action-label">Run as Admin</span><span class="action-kbd">Ctrl+Shift+↵</span></button>`;
        }
        html += `<button class="detail-action-btn" onclick="copyItemText('${safePath}')"><span class="action-label">Copy Path</span><span class="action-kbd">Ctrl+C</span></button>`;
      }
    }
    html += `</div>`; // Close detail-actions-section

    detailsPanel.innerHTML = html;
    updateLayout();
  }

  function inspectToolDeep(toolId) {
    const deepContainer = document.getElementById('detailDeepContainer');
    if (!deepContainer) return;
    deepContainer.innerHTML = '<div style="color:var(--text-muted);font-size:11px;margin-top:8px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading deep diagnostics...</div>';
    callBackend('get_tool_deep', { tool_id: toolId }).then(report => {
      if (!report || Object.keys(report).length === 0) {
        deepContainer.innerHTML = '<div style="color:var(--text-muted);font-size:11px;margin-top:8px;">No deep diagnostics available.</div>';
        return;
      }
      let html = '<div class="detail-deep-telemetry">';
      if (report.probe_latency_ms !== undefined) {
        html += '<div class="detail-meta-row"><span class="detail-meta-key">Probe Latency</span><span class="detail-meta-val">' + report.probe_latency_ms + 'ms</span></div>';
      }
      if (report.instances && report.instances.length > 0) {
        html += '<div class="detail-deep-section-label">Discovered Instances (' + report.instances.length + ')</div>';
        for (let inst of report.instances.slice(0, 2)) {
          const activeTag = inst.is_active ? '<span style="color:#10b981;font-weight:600;">[Active]</span> ' : '<span style="color:var(--text-muted);">[Alt]</span> ';
          const v = inst.version ? ' (' + inst.version + ')' : '';
          html += '<div style="font-family:var(--font-mono);font-size:10px;margin-top:2px;word-break:break-all;">' + activeTag + escapeHtml(inst.binary_path || inst.path) + v + '</div>';
        }
      }
      if (report.env_vars && report.env_vars.length > 0) {
        html += '<div class="detail-deep-section-label">Environment Alignment</div>';
        for (let ev of report.env_vars.slice(0, 3)) {
          const color = ev.status === 'aligned' ? '#10b981' : (ev.status === 'divergent' ? '#f59e0b' : '#94a3b8');
          html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:10.5px;margin-top:2px;"><span style="font-family:var(--font-mono);">' + escapeHtml(ev.name) + '</span><span style="color:' + color + ';font-size:9.5px;text-transform:uppercase;font-weight:600;">' + ev.status + '</span></div>';
        }
      }
      html += '</div>';
      deepContainer.innerHTML = html;
      updateLayout();
    }).catch(err => {
      deepContainer.innerHTML = '<div style="color:#ef4444;font-size:11px;margin-top:8px;">Failed to load deep diagnostics.</div>';
      updateLayout();
    });
  }

  function updateStatusIndicator(overrideText = null) {
    const statusInd = document.getElementById('statusIndicator');
    if (!statusInd) return;

    if (overrideText) {
      statusInd.innerHTML = `<span class="status-text">${escapeHtml(overrideText)}</span>`;
      statusInd.className = 'status-indicator';
      statusInd.style.display = 'flex';
      statusInd.onclick = null;
      statusInd.style.cursor = 'default';
      statusInd.title = '';
      return;
    }

    // Do NOT show daemon status in the footer bar at all (quiet, distraction-free)
    statusInd.style.display = 'none';
    statusInd.innerHTML = '';
  }

  function checkDaemonStatus() {
    callBackend('get_daemon_status').then(res => {
      isDaemonOnline = !!(res && (res.online || res.status === 'online'));
      updateStatusIndicator(isSettingsMode ? 'spotlight.json' : null);
    });
  }

  function measureDetailsPanelHeight() {
    if (!detailsPanel || !currentSettings.show_details_panel) return 0;
    if (detailsPanel.style.display === 'none') return 0;

    let totalContentHeight = 0;
    const children = detailsPanel.children;
    for (let i = 0; i < children.length; i++) {
      const child = children[i];
      if (!child || child.style.display === 'none') continue;

      const rect = child.getBoundingClientRect();
      const style = window.getComputedStyle(child);
      const h = rect.height > 0 ? rect.height : child.offsetHeight;
      const mb = parseFloat(style.marginBottom) || 0;
      // If child is .detail-actions-section, use natural top margin (10px) rather than flex auto-margin
      const mt = child.classList.contains('detail-actions-section') ? 10 : (parseFloat(style.marginTop) || 0);

      totalContentHeight += h + mt + mb;
    }

    const panelStyle = window.getComputedStyle(detailsPanel);
    const pt = parseFloat(panelStyle.paddingTop) || 14;
    const pb = parseFloat(panelStyle.paddingBottom) || 14;

    return Math.ceil(totalContentHeight + pt + pb);
  }

  function updateLayout() {
    const footerBar = document.querySelector('.footer-bar');
    const searchBar = document.querySelector('.search-bar');

    updateDetailsPanelVisibility();

    if (isSettingsMode) {
      searchBar.classList.add('has-results');
      contentArea.classList.add('visible');
      const count = Math.min(resultsList.children.length, 9);
      const targetHeight = Math.min(58 + (count * 52) + 34, 620);
      callBackend('resize_window', { height: targetHeight });

      const hints = footerBar.querySelector('.hotkey-hints');
      if (hints) {
        hints.innerHTML = `
          <span><span class="key-badge">Esc</span> Back to Search</span>
          <span><span class="key-badge">↑↓</span> Navigate</span>
        `;
      }
      updateStatusIndicator('spotlight.json');
      return;
    }

    if (items.length === 0) {
      searchBar.classList.remove('has-results');
      contentArea.classList.remove('visible');
      callBackend('resize_window', { height: 92 });

      const hints = footerBar.querySelector('.hotkey-hints');
      if (hints) {
        hints.innerHTML = `
          <span><span class="key-badge">Esc</span> Dismiss</span>
          <span><span class="key-badge">?</span> Help</span>
          <span><span class="key-badge">&gt;</span> Commands</span>
        `;
      }
      updateStatusIndicator();
    } else {
      searchBar.classList.add('has-results');
      contentArea.classList.add('visible');
      const count = Math.min(items.length, 9);
      const listHeight = count * 50;

      let targetHeight;
      if (currentSettings.show_details_panel) {
        const BASE_DETAILS_CONTENT_HEIGHT = 420;
        const detailsH = measureDetailsPanelHeight();
        // Stable, rock-solid height (420px content / 512px window) for standard items,
        // dynamically expanding only when an item requires more space (e.g. deep telemetry).
        // Prevents accumulative height creep when scrolling with arrow keys.
        const contentHeight = Math.max(BASE_DETAILS_CONTENT_HEIGHT, detailsH);
        targetHeight = Math.min(58 + contentHeight + 34, 640);
      } else {
        const baseHeight = 58 + listHeight + 34;
        targetHeight = Math.min(baseHeight, 560);
      }

      callBackend('resize_window', { height: targetHeight });

      const hints = footerBar.querySelector('.hotkey-hints');
      if (hints) {
        const detailsLabel = currentSettings.show_details_panel ? 'Hide Details' : 'Details';
        hints.innerHTML = `
          <span><span class="key-badge">↑↓</span> Navigate</span>
          <span><span class="key-badge">↵</span> Open</span>
          <span><span class="key-badge">Shift+↵</span> Explorer</span>
          <span id="footerDetailsToggle" style="cursor: pointer;" title="Toggle Details Panel (F1)"><span class="key-badge">F1</span> <span id="footerDetailsLabel">${detailsLabel}</span></span>
          <span><span class="key-badge">Esc</span> Dismiss</span>
        `;
        const toggleEl = document.getElementById('footerDetailsToggle');
        if (toggleEl) {
          toggleEl.onclick = (e) => {
            e.stopPropagation();
            toggleDetailsPanel();
          };
        }
      }
      updateStatusIndicator();
    }
  }

  window.focusInput = function() {
    window.focus();
    if (searchInput) {
      searchInput.focus({ preventScroll: true });
      const len = searchInput.value.length;
      try {
        searchInput.setSelectionRange(len, len);
      } catch (e) {}
    }
  };

  window.resetSpotlight = window.resetPalette = function() {
    isSettingsMode = false;
    callBackend('set_settings_open', { open: false });
    searchInput.value = '';
    updatePrefixBadge('');
    activeIndex = 0;
    if (detailsPanel) {
      detailsPanel.innerHTML = '';
    }
    items = [];
    renderResults();
    checkDaemonStatus();
    window.focusInput();
    setTimeout(window.focusInput, 25);
    setTimeout(window.focusInput, 75);
    setTimeout(window.focusInput, 150);
  };

  function performSearch(q) {
    const currentSeq = ++searchSeq;
    const query = (q || '').trim();

    if (!query) {
      items = [];
      activeIndex = 0;
      if (detailsPanel) detailsPanel.innerHTML = '';
      renderResults();
      checkDaemonStatus();
      return;
    }

    callBackend('search', { query: query }).then(data => {
      if (currentSeq !== searchSeq) return;
      items = data || [];
      activeIndex = 0;
      renderResults();
    });
  }

  function renderResults() {
    resultsList.innerHTML = '';
    if (items.length === 0) {
      updateLayout();
      return;
    }

    items.forEach((item, idx) => {
      const li = document.createElement('li');
      li.className = 'result-item' + (idx === activeIndex ? ' active' : '');
      li.style.setProperty('--item-idx', Math.min(idx, 8));
      li.onclick = (e) => {
        if (e) e.stopPropagation();
        activeIndex = idx;
        renderSelection();
        handlePrimaryAction(item);
      };

      const iconBox = document.createElement('div');
      let iconBoxCls = 'item-icon-box ' + getItemIconClass(item);
      if (item.icon) {
        iconBoxCls += ' is-app-icon';
      }
      iconBox.className = iconBoxCls;
      iconBox.innerHTML = getItemIconHtml(item);

      const info = document.createElement('div');
      info.className = 'result-info';

      const title = document.createElement('div');
      title.className = 'result-title';
      title.textContent = item.title;

      const sub = document.createElement('div');
      sub.className = 'result-subtitle';
      sub.textContent = item.subtitle;

      info.appendChild(title);
      info.appendChild(sub);

      const badge = document.createElement('span');
      badge.className = 'item-badge badge-' + (item.badge ? String(item.badge).replace(/\s+/g, '_') : 'DEFAULT');
      badge.textContent = item.badge || 'ITEM';

      li.appendChild(iconBox);
      li.appendChild(info);
      li.appendChild(badge);
      resultsList.appendChild(li);
    });

    renderSelection();
  }

  function renderSelection() {
    const lis = resultsList.querySelectorAll('.result-item');
    lis.forEach((li, idx) => {
      if (idx === activeIndex) {
        li.classList.add('active');
        li.scrollIntoView({ block: 'nearest' });
      } else {
        li.classList.remove('active');
      }
    });

    if (!isSettingsMode && currentSettings.show_details_panel && items[activeIndex]) {
      renderDetailsPanel(items[activeIndex]);
    } else {
      updateLayout();
    }
  }

  // Settings Mode Implementation (Rendered as rows matching search results)
  function openSettings() {
    isSettingsMode = true;
    searchInput.value = '> settings';
    updatePrefixBadge('> settings');
    callBackend('set_settings_open', { open: true });
    callBackend('get_settings').then(s => {
      if (s) Object.assign(currentSettings, s);
      renderSettings();
      window.focusInput();
    });
  }

  function closeSettings() {
    isSettingsMode = false;
    callBackend('set_settings_open', { open: false });
    searchInput.value = '';
    updatePrefixBadge('');
    performSearch('');
    window.focusInput();
  }

  function renderSettings(filterText = '') {
    resultsList.innerHTML = '';
    const ft = filterText.toLowerCase().trim();

    const filtered = SETTING_DEFINITIONS.filter(def => {
      if (!ft) return true;
      return def.name.toLowerCase().includes(ft) ||
             def.desc.toLowerCase().includes(ft) ||
             def.key.toLowerCase().includes(ft);
    });

    if (filtered.length === 0) {
      const li = document.createElement('li');
      li.className = 'result-item';
      li.style.justifyContent = 'center';
      li.style.color = 'var(--text-dim)';
      li.style.padding = '18px';
      li.textContent = 'No matching settings found.';
      resultsList.appendChild(li);
      updateLayout();
      return;
    }

    filtered.forEach((def, idx) => {
      const li = document.createElement('li');
      li.className = 'result-item setting-item' + (idx === activeIndex ? ' active' : '');
      li.style.setProperty('--item-idx', Math.min(idx, 8));
      li.onclick = () => {
        activeIndex = idx;
        renderSelection();
      };

      const iconBox = document.createElement('div');
      iconBox.className = 'item-icon-box ' + getSettingIconClass(def.key);
      iconBox.innerHTML = getSettingIconHtml(def.key);

      // Left side: Title and Description
      const info = document.createElement('div');
      info.className = 'result-info';

      const title = document.createElement('div');
      title.className = 'result-title';
      title.textContent = def.name;

      const sub = document.createElement('div');
      sub.className = 'result-subtitle';
      sub.textContent = def.desc;

      info.appendChild(title);
      info.appendChild(sub);
      li.appendChild(iconBox);
      li.appendChild(info);

      // Right side: Input Control or Indicator
      const ctrl = document.createElement('div');
      ctrl.className = 'setting-control';

      if (def.type === 'color') {
        ctrl.className = 'setting-control color-presets';
        def.presets.forEach(colorHex => {
          const dot = document.createElement('span');
          dot.className = 'color-dot' + (currentSettings.accent_color === colorHex ? ' active' : '');
          dot.style.background = colorHex;
          dot.title = colorHex;
          dot.onclick = (e) => {
            e.stopPropagation();
            setThemeColor(colorHex);
          };
          ctrl.appendChild(dot);
        });
      } else if (def.type === 'range') {
        ctrl.className = 'setting-control slider-control';
        const range = document.createElement('input');
        range.type = 'range';
        range.className = 'setting-range';
        range.min = def.min;
        range.max = def.max;
        const currentVal = def.getValue(currentSettings);
        range.value = currentVal;

        const valLabel = document.createElement('span');
        valLabel.className = 'setting-val-label';
        valLabel.textContent = currentVal + def.unit;

        range.oninput = (e) => {
          e.stopPropagation();
          valLabel.textContent = range.value + def.unit;
          def.onChange(range.value);
        };
        ctrl.appendChild(range);
        ctrl.appendChild(valLabel);
      } else if (def.type === 'select') {
        const sel = document.createElement('select');
        sel.className = 'setting-select';
        const currentVal = def.getValue(currentSettings);
        def.options.forEach(opt => {
          const optEl = document.createElement('option');
          optEl.value = opt.value;
          optEl.textContent = opt.label;
          if (opt.value === currentVal) optEl.selected = true;
          sel.appendChild(optEl);
        });
        sel.onchange = (e) => {
          e.stopPropagation();
          def.onChange(sel.value);
        };
        ctrl.appendChild(sel);
      } else if (def.type === 'toggle') {
        const btn = document.createElement('button');
        const isTrue = def.getValue(currentSettings);
        btn.className = 'toggle-btn' + (isTrue ? ' active' : '');
        btn.textContent = isTrue ? 'ON' : 'OFF';
        btn.onclick = (e) => {
          e.stopPropagation();
          def.onChange(!isTrue);
        };
        ctrl.appendChild(btn);
      } else if (def.type === 'badge') {
        const badge = document.createElement('span');
        badge.className = 'setting-hotkey-badge';
        badge.textContent = def.getValue(currentSettings);
        ctrl.appendChild(badge);
      }

      li.appendChild(ctrl);
      resultsList.appendChild(li);
    });

    updateLayout();
    renderSelection();
  }

  function setThemeColor(hex) {
    currentSettings.accent_color = hex;
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-glow', hex + '40');
    callBackend('update_settings', { accent_color: hex });
    if (isSettingsMode) renderSettings();
  }

  function setOpacity(val) {
    const num = Math.round(Number(val));
    const dec = (num / 100.0).toFixed(2);
    currentSettings.opacity = Number(dec);
    document.documentElement.style.setProperty('--bg-opacity', dec);
    const shell = document.querySelector('.spotlight-shell');
    if (shell) {
      shell.style.backgroundColor = `rgba(10, 14, 23, ${dec})`;
    }
    callBackend('update_settings', { opacity: Number(dec) });
  }

  function setBlur(val) {
    const num = Math.round(Number(val));
    currentSettings.blur_radius = num;
    document.documentElement.style.setProperty('--blur-val', num + 'px');
    callBackend('update_settings', { blur_radius: num });
  }

  function setAnimationSpeed(val) {
    currentSettings.animation_speed = val;
    applyAnimationSpeed(val);
    callBackend('update_settings', { animation_speed: val });
    if (isSettingsMode) renderSettings();
  }

  function applyAnimationSpeed(speed) {
    const root = document.documentElement;
    if (speed === 'fast') {
      root.style.setProperty('--anim-duration', '100ms');
      root.style.setProperty('--anim-fast', '70ms');
      root.style.setProperty('--anim-stagger', '10ms');
    } else if (speed === 'relaxed') {
      root.style.setProperty('--anim-duration', '240ms');
      root.style.setProperty('--anim-fast', '150ms');
      root.style.setProperty('--anim-stagger', '20ms');
    } else if (speed === 'off') {
      root.style.setProperty('--anim-duration', '0ms');
      root.style.setProperty('--anim-fast', '0ms');
      root.style.setProperty('--anim-stagger', '0ms');
    } else { // normal (default)
      root.style.setProperty('--anim-duration', '160ms');
      root.style.setProperty('--anim-fast', '110ms');
      root.style.setProperty('--anim-stagger', '14ms');
    }
  }

  function setMonitorMode(val) {
    currentSettings.monitor_mode = val;
    callBackend('update_settings', { monitor_mode: val });
  }

  function setPositionPreset(val) {
    currentSettings.position_preset = val;
    callBackend('update_settings', { position_preset: val });
  }

  function setDismissOnBlur(val) {
    currentSettings.dismiss_on_blur = !!val;
    callBackend('update_settings', { dismiss_on_blur: currentSettings.dismiss_on_blur });
    if (isSettingsMode) renderSettings();
  }

  function setThemePreset(preset) {
    currentSettings.theme_preset = preset;
    const presetColors = {
      obsidian: '#38bdf8',
      emerald: '#34d399',
      indigo: '#a78bfa',
      amber: '#f59e0b'
    };
    const color = presetColors[preset] || '#38bdf8';
    currentSettings.accent_color = color;
    document.documentElement.style.setProperty('--accent', color);
    document.documentElement.style.setProperty('--accent-glow', color + '40');
    callBackend('update_settings', { theme_preset: preset, accent_color: color });
    if (isSettingsMode) renderSettings();
  }

  // PyWebView Bridge call
  function callBackend(funcName, params = {}) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api[funcName]) {
      return window.pywebview.api[funcName](params);
    }
    return Promise.resolve([]);
  }

  // Click on background card focuses search input unless interacting with controls
  document.addEventListener('click', (e) => {
    const isInteractive = e.target.closest('.result-item, button, input, select, .drawer-row, .setting-control, .color-dot');
    if (!isInteractive) {
      window.focusInput();
    }
  });

  // Window focus listener: guarantee active input caret whenever spotlight window is focused
  window.addEventListener('focus', () => {
    window.focusInput();
    checkDaemonStatus();
  });

  // Immediate render of empty state
  renderResults();
  checkDaemonStatus();

  window.reloadSpotlightSettings = function() {
    return callBackend('get_settings').then(s => {
      if (!s) return;
      Object.assign(currentSettings, s);
      const isSystem = (s.theme_preset === 'system');
      const eff = s.effective_theme || {};
      const sysTheme = s.system_theme || {};
      const shell = document.querySelector('.spotlight-shell');

      if (isSystem) {
        const isDark = (sysTheme.dark_mode !== undefined) ? sysTheme.dark_mode : !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        const sysAccent = eff.accent_color || sysTheme.accent_color || '#0078d4';
        document.documentElement.style.setProperty('--accent', sysAccent);
        document.documentElement.style.setProperty('--accent-glow', sysAccent + '35');
        document.documentElement.style.setProperty('--border', sysAccent + '60');
        document.documentElement.style.setProperty('--border-active', sysAccent + '85');
        document.documentElement.style.setProperty('--corner-radius', '8px');
        document.documentElement.style.setProperty('--blur-val', '36px');
        if (shell) {
          shell.style.backdropFilter = 'blur(36px) saturate(190%)';
          shell.style.webkitBackdropFilter = 'blur(36px) saturate(190%)';
          shell.style.borderRadius = '8px';
          shell.style.border = `1px solid ${sysAccent}60`;
          if (isDark) {
            shell.style.background = 'rgba(14, 18, 28, 0.65)';
            shell.style.boxShadow = `0 20px 50px -10px rgba(0, 0, 0, 0.85), 0 0 30px ${sysAccent}35`;
            document.documentElement.style.setProperty('--text-main', '#f8fafc');
          } else {
            shell.style.background = 'rgba(240, 244, 250, 0.70)';
            shell.style.boxShadow = `0 20px 50px -10px rgba(0, 0, 0, 0.25), 0 0 30px ${sysAccent}30`;
            document.documentElement.style.setProperty('--text-main', '#0f172a');
          }
        }
      } else {
        const accent = eff.accent_color || s.accent_color || '#38bdf8';
        const opacity = (s.opacity !== undefined && s.opacity !== null) ? s.opacity : (eff.opacity || 0.92);
        const blurRadius = (s.blur_radius !== undefined && s.blur_radius !== null) ? s.blur_radius : (eff.blur_radius || 20);

        document.documentElement.style.setProperty('--accent', accent);
        document.documentElement.style.setProperty('--accent-glow', accent + '30');
        document.documentElement.style.setProperty('--border', accent + '60');
        document.documentElement.style.setProperty('--border-active', accent + '85');
        document.documentElement.style.setProperty('--corner-radius', '8px');
        document.documentElement.style.setProperty('--blur-val', blurRadius + 'px');
        document.documentElement.style.setProperty('--text-main', '#f8fafc');

        const dec = (Math.round(opacity * 100) / 100.0).toFixed(2);
        document.documentElement.style.setProperty('--bg-opacity', dec);
        if (shell) {
          shell.style.background = `rgba(10, 14, 23, ${dec})`;
          shell.style.border = `1px solid ${accent}60`;
          shell.style.boxShadow = `0 20px 50px -10px rgba(0, 0, 0, 0.85), 0 0 30px ${accent}30`;
          shell.style.backdropFilter = `blur(${blurRadius}px)`;
          shell.style.webkitBackdropFilter = `blur(${blurRadius}px)`;
          shell.style.borderRadius = '8px';
        }
      }
      if (s.animation_speed) {
        applyAnimationSpeed(s.animation_speed);
      }
      if (s.show_details_panel !== undefined && s.show_details_panel !== null) {
        currentSettings.show_details_panel = !!s.show_details_panel;
        updateDetailsPanelVisibility();
      }
    });
  };

  // Initial load
  window.addEventListener('pywebviewready', () => {
    window.reloadSpotlightSettings();
    checkDaemonStatus();
    setInterval(checkDaemonStatus, 5000);
    performSearch('');
    window.focusInput();
  });
</script>

</body>
</html>
